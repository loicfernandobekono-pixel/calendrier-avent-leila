<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#24172b"><title>Jour 5 — La quête du chevalier</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171321;font-family:Georgia,serif;color:#fff0d6}#game{position:relative;width:100%;height:100%;min-height:420px;background:#171321;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(90deg,#291a31,#48263d);border-bottom:2px solid #c9a66b;font:12px system-ui;z-index:2}header strong{color:#f2d59b;letter-spacing:.08em}#stats{display:flex;gap:12px;align-items:center;font-weight:700}#stage{position:relative;flex:1;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#170f24c9;padding:18px;text-align:center;z-index:3}#overlay.hidden{display:none}.panel{max-width:480px;padding:22px;background:linear-gradient(145deg,#50314a,#281c35);border:2px solid #d5b777;box-shadow:0 0 0 5px #d5b77722,0 15px 50px #0009}.panel h1{font-size:clamp(27px,6vw,42px);font-weight:400;color:#ffe5ae;margin:0 0 10px}.panel p{font:14px/1.6 system-ui;color:#f5e6df}.gold{color:#ffd76e}.mainbtn{border:2px solid #f4d18c;background:#a34e62;color:#fff4df;padding:12px 22px;font-weight:700;letter-spacing:.06em;margin-top:8px;cursor:pointer}.mainbtn:active{transform:translateY(2px)}#controls{display:flex;justify-content:space-between;align-items:center;padding:8px 14px max(10px,env(safe-area-inset-bottom));background:#21182c;border-top:1px solid #9e7b75;gap:14px;z-index:2}.cluster{display:flex;gap:10px}.control{width:58px;height:52px;border:2px solid #c8a879;border-radius:12px;background:linear-gradient(#59405b,#33243e);color:#fff0d6;font:700 22px system-ui;touch-action:none;user-select:none}.control:active,.control.pressed{background:#a14d66;transform:scale(.96)}.control.attack{width:68px;background:linear-gradient(#9a5060,#54283e)}.hint{font:10px system-ui;color:#d8c3c8;text-align:center}@media(min-width:800px){#controls{justify-content:center}.control{width:64px;height:54px}}@media(max-height:500px){header{padding:4px 10px}#controls{padding:4px 10px}.control{height:44px;width:52px}.control.attack{width:60px}}
</style></head>
<body><div id="game"><header><strong>✦ LA QUÊTE DU CHEVALIER ✦</strong><div id="stats"><span id="hearts">♡ ♡ ♡</span><span id="kills">Monstres : 0/4</span></div></header><div id="stage"><canvas id="c" width="960" height="540" aria-label="Jeu de plateforme du chevalier"></canvas><div id="overlay"><div class="panel"><h1>La quête du chevalier</h1><p>Une forêt enchantée, des monstres et <span class="gold">3 cœurs</span> à retrouver. Bats les gardiens, récupère les trois cœurs et rejoins ta princesse au château.</p><p>← → avancer · ↑ sauter · ⚔ attaquer</p><button class="mainbtn" id="start">COMMENCER L'AVENTURE</button></div></div></div><div id="controls"><div class="cluster"><button class="control" data-key="left" aria-label="Aller à gauche">◀</button><button class="control" data-key="right" aria-label="Aller à droite">▶</button></div><div class="hint">TRAVERSE LA FORÊT<br>ET RETROUVE-LA</div><div class="cluster"><button class="control attack" data-key="attack" aria-label="Attaquer">⚔</button><button class="control" data-key="jump" aria-label="Sauter">▲</button></div></div></div>
<script>
(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),W=960,H=540,world=3400,ground=445;ctx.imageSmoothingEnabled=false;
const keys={left:false,right:false,jump:false,attack:false};let running=false,won=false,last=0,camera=0,heartCount=0,kills=0,attackTime=0,attackCooldown=0,toast='',toastTime=0;
const player={x:70,y:ground-58,w:36,h:58,vx:0,vy:0,on:false,face:1,inv:0};
const platforms=[{x:0,y:ground,w:760},{x:820,y:ground,w:650},{x:1530,y:ground,w:620},{x:2210,y:ground,w:1190},{x:450,y:355,w:130},{x:1060,y:350,w:150},{x:1780,y:350,w:140},{x:2500,y:350,w:150}];
const hearts=[{x:550,y:318,taken:false},{x:1370,y:310,taken:false},{x:2620,y:310,taken:false}];
const enemies=[{x:380,y:ground-34,w:34,h:34,hp:1,alive:true,lo:300,hi:510,v:1.2},{x:990,y:ground-34,w:34,h:34,hp:1,alive:true,lo:870,hi:1200,v:-1.1},{x:1880,y:ground-34,w:34,h:34,hp:1,alive:true,lo:1660,hi:2020,v:1.25},{x:2370,y:ground-34,w:34,h:34,hp:1,alive:true,lo:2260,hi:2510,v:-1.35}];
const gate={x:3020,y:ground-112,w:70,h:112};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function text(t,x,y,size=16,col='#fff0d6',align='left'){ctx.fillStyle=col;ctx.font='bold '+size+'px monospace';ctx.textAlign=align;ctx.fillText(t,x,y)}
function drawKnight(x,y){const f=player.face;ctx.save();ctx.translate(Math.round(x+18),Math.round(y));ctx.scale(f,1);rect(-14,48,12,8,'#29233a');rect(2,48,12,8,'#29233a');rect(-12,22,25,27,'#b9c4d2');rect(-12,26,25,5,'#788ba6');rect(-9,31,18,14,'#d5dce4');rect(-8,4,17,18,'#8b4b32');rect(-9,2,19,7,'#b76a42');for(let i=0;i<5;i++)rect(-10+i*4,-1+(i%2)*2,4,5,'#bd7445');rect(-11,10,5,3,'#382333');rect(4,10,5,3,'#382333');rect(-15,22,6,20,'#8f334e');rect(-19,22,9,31,'#9f3f5c');rect(-14,20,26,5,'#d6dce5');rect(10,25,6,17,'#b9c4d2');rect(13,17,4,25,'#cbd4dd');rect(16,10,3,17,'#f4e4bd');ctx.restore()}
function drawPrincess(x,y){rect(x+7,y+20,26,34,'#f3d7d4');rect(x+5,y+7,30,22,'#4c2c32');rect(x+7,y+12,26,20,'#f0b68e');rect(x+4,y+4,32,12,'#30202d');rect(x+1,y+14,8,34,'#3a2432');rect(x+31,y+14,8,34,'#3a2432');rect(x+10,y+25,4,3,'#382333');rect(x+25,y+25,4,3,'#382333');rect(x+8,y+54,25,5,'#d6b4a4');rect(x+10,y-2,5,8,'#e9c66f');rect(x+17,y-7,5,13,'#e9c66f');rect(x+24,y-2,5,8,'#e9c66f');rect(x+12,y+34,18,20,'#fff0e2')}
function drawMonster(e){const x=e.x,y=e.y;rect(x+4,y+10,26,21,'#654d94');rect(x+1,y+17,32,13,'#765eaa');rect(x+7,y+6,20,8,'#9079c4');rect(x+8,y+18,5,6,'#f6e7ff');rect(x+22,y+18,5,6,'#f6e7ff');rect(x+10,y+20,2,3,'#20172d');rect(x+24,y+20,2,3,'#20172d');rect(x+9,y+31,5,4,'#40305e');rect(x+23,y+31,5,4,'#40305e')}
function drawHeart(x,y){text('♥',x,y,28,'#ff648c','center');rect(x-2,y-22,4,3,'#ffd8e0')}
function drawTree(x,y,s=1){rect(x+24*s,y,12*s,95*s,'#4b2b3d');rect(x,y+12*s,70*s,34*s,'#315344');rect(x+9*s,y-8*s,54*s,36*s,'#3f7155');rect(x+18*s,y-18*s,34*s,24*s,'#56845e');for(let i=0;i<5;i++)rect(x+(i*11+5)*s,y+(i%2)*13*s,5*s,5*s,'#e58db1')}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#312849');g.addColorStop(.55,'#76506d');g.addColorStop(1,'#e59b82');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);rect(0,220,W,115,'#433958');rect(0,300,W,70,'#54405d');for(let i=0;i<8;i++){let x=((i*175-camera*.24)%(W+180)+W+180)%(W+180)-80;drawTree(x,180+(i%3)*26,.9+(i%2)*.25)}rect(0,ground,W,H-ground,'#385c48');rect(0,ground,W,13,'#73905c');for(let x=0;x<W;x+=40){rect(x,ground+18,25,4,'#294536');rect(x+12,ground+39,15,4,'#294536')}for(let x=0;x<W;x+=85){rect(x+12,ground+7,3,7,'#b2a16c');rect(x+8,ground+4,4,4,'#e7a2b6')}}
function drawWorld(){drawBackground();ctx.save();ctx.translate(-camera,0);
platforms.forEach(p=>{rect(p.x,p.y,p.w,95,'#51405b');rect(p.x,p.y,p.w,10,'#789260');for(let x=p.x;x<p.x+p.w;x+=38){rect(x,p.y+18,28,5,'#3d3048');rect(x+9,p.y+40,19,5,'#6b5369')}});
for(let x=600;x<world;x+=430){drawTree(x,ground-90,1)}
hearts.forEach(h=>{if(!h.taken){drawHeart(h.x,h.y);rect(h.x-12,h.y+4,24,2,'#ffd66e')}})
enemies.forEach(e=>{if(e.alive)drawMonster(e)})
// gate
rect(gate.x,gate.y,gate.w,gate.h,'#563b55');rect(gate.x+8,gate.y+8,gate.w-16,gate.h-8,'#2b2038');rect(gate.x+26,gate.y+32,18,80,'#d0a96f');rect(gate.x+31,gate.y+40,8,8,'#fff0b0');text(heartCount===3&&kills===enemies.length?'OPEN':'LOCKED',gate.x+gate.w/2,gate.y-12,12,'#ffe0a0','center');
drawKnight(player.x,player.y);drawPrincess(3240,ground-60);
ctx.restore()}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function attack(){if(attackCooldown>0)return;attackCooldown=.38;attackTime=.18;const box={x:player.face>0?player.x+player.w:player.x-54,y:player.y+10,w:54,h:42};let hit=false;enemies.forEach(e=>{if(e.alive&&overlap(box,e)){e.hp--;if(e.hp<=0){e.alive=false;kills++;hit=true}}});if(hit)toastMsg('Un monstre vaincu !');}
function toastMsg(s){toast=s;toastTime=1.3}
function update(dt){if(!running||won)return;dt=Math.min(dt,.033);if(keys.left){player.vx=-205;player.face=-1}else if(keys.right){player.vx=205;player.face=1}else player.vx*=.78;
if(keys.jump&&player.on){player.vy=-480;player.on=false}if(keys.attack)attack();player.vy+=1050*dt;let oldY=player.y;player.x=clamp(player.x+player.vx*dt,0,world-player.w);player.y+=player.vy*dt;player.on=false;
platforms.forEach(p=>{if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+8&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.on=true}});
if(player.y>H+80){player.x=Math.max(40,player.x-120);player.y=ground-player.h;player.vy=0;toastMsg('Attention au chemin !')}
hearts.forEach(h=>{if(!h.taken&&Math.abs((player.x+18)-h.x)<28&&Math.abs((player.y+25)-h.y)<38){h.taken=true;heartCount++;toastMsg('Un cœur retrouvé ! ♥')}});
enemies.forEach(e=>{if(!e.alive)return;e.x+=e.v*75*dt;if(e.x<e.lo||e.x>e.hi)e.v*=-1;if(overlap(player,e)&&player.inv<=0){player.inv=1;player.x-=player.face*45;toastMsg('Aïe ! Évite les monstres !')}});
if(player.inv>0)player.inv-=dt;if(attackCooldown>0)attackCooldown-=dt;if(attackTime>0)attackTime-=dt;
camera=clamp(player.x-350,0,world-W);
if(player.x>gate.x-10){if(heartCount===3&&kills===enemies.length){won=true;finish()}else{player.x=gate.x-65;toastMsg('Il te faut les 3 cœurs et vaincre tous les monstres !')}}
document.getElementById('hearts').textContent='♥ '.repeat(heartCount)+'♡ '.repeat(3-heartCount);document.getElementById('kills').textContent='Monstres : '+kills+'/'+enemies.length;
}
function finish(){const ov=document.getElementById('overlay');ov.innerHTML='<div class="panel"><h1>Tu as réussi…</h1><p>Les trois cœurs sont réunis. Tous les monstres sont vaincus. Et au bout du chemin, il n’y avait qu’une seule personne que tu voulais retrouver.</p><p class="gold" style="font-size:20px">« Peu importe les obstacles, je trouverai toujours le chemin jusqu’à toi. » ♥</p><button class="mainbtn" id="replay">REVIVRE L’AVENTURE</button></div>';ov.classList.remove('hidden');document.getElementById('replay').onclick=()=>location.reload()}
function frame(t){let dt=(t-last)/1000||0;last=t;update(dt);drawWorld();if(attackTime>0){ctx.save();ctx.translate(player.face>0?player.x-camera+48:player.x-camera-12,player.y+28);ctx.strokeStyle='#ffe39a';ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,31,-.8,1.1);ctx.stroke();ctx.restore()}if(toastTime>0){toastTime-=dt;ctx.fillStyle='#27192ddd';ctx.fillRect(210,18,540,34);text(toast,480,41,15,'#ffe6ae','center')}requestAnimationFrame(frame)}
document.getElementById('start').onclick=()=>{document.getElementById('overlay').classList.add('hidden');running=true};
document.querySelectorAll('.control').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys[k]=true;b.classList.add('pressed')};const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','x','X'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.jump=true;if(e.key==='x'||e.key==='X')keys.attack=true});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.jump=false;if(e.key==='x'||e.key==='X')keys.attack=false});
requestAnimationFrame(frame);
})();
</script></body></html>
